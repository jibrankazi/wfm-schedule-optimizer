services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      AUDIT_VAULT_PATH: /app/runtime/audit_vault.jsonl
    ports:
      - "8000:8000"
    volumes:
      - audit-data:/app/runtime

  portal:
    build: .
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"

volumes:
  audit-data:
