name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Types
        run: mypy src/ api/

      - name: Tests
        run: pytest -q

      # The formulation is guarded separately from the features. A two-sided
      # coverage equality shipped once already and no feature test caught it.
      - name: Formulation invariants
        run: pytest -q tests/test_formulation_invariants.py tests/test_formulation_ablation.py

      # A published artifact is a claim about the model, so a regressed one
      # must fail the build rather than sit in the repository unnoticed.
      - name: Published results
        run: python scripts/check_baseline.py

      - name: Demo solve completes
        run: python run_247.py --solve --demo
