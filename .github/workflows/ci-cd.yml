name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: mypy src/erlang_advanced.py src/audit_vault.py src/smart_rebalancer.py api/main.py
      - run: pytest -q
      - name: Solve the weekly schedule
        run: python run_pipeline.py --time-limit 90

  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: wfm-schedule-optimizer:${{ github.sha }}
